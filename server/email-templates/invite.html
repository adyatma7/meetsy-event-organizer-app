<!-- Meetsy Event Management System — Invitation Email Template -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0; padding:0; background-color:#f4f4f7; font-family:Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7; padding:32px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:8px; overflow:hidden;">
          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(135deg,#6366f1,#8b5cf6); padding:32px; text-align:center;">
              <h1 style="color:#ffffff; margin:0; font-size:24px;">Undangan Seminar</h1>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:32px;">
              <p style="color:#374151; font-size:16px; line-height:1.6;">
                Yth. <strong>{{participantName}}</strong>,
              </p>
              <p style="color:#374151; font-size:16px; line-height:1.6;">
                Anda diundang untuk menghadiri:
              </p>
              <table width="100%" style="background:#f9fafb; border-radius:8px; padding:20px; margin:16px 0;">
                <tr><td style="color:#6b7280; font-size:14px; padding:4px 0;">Event</td><td style="color:#111827; font-size:14px; padding:4px 0;"><strong>{{eventTitle}}</strong></td></tr>
                <tr><td style="color:#6b7280; font-size:14px; padding:4px 0;">Tanggal</td><td style="color:#111827; font-size:14px; padding:4px 0;">{{eventDate}}</td></tr>
                <tr><td style="color:#6b7280; font-size:14px; padding:4px 0;">Waktu</td><td style="color:#111827; font-size:14px; padding:4px 0;">{{eventTime}}</td></tr>
                <tr><td style="color:#6b7280; font-size:14px; padding:4px 0;">Tempat</td><td style="color:#111827; font-size:14px; padding:4px 0;">{{eventVenue}}</td></tr>
              </table>
              <p style="text-align:center; margin:24px 0;">
                <a href="{{registrationLink}}" style="display:inline-block; background:#6366f1; color:#ffffff; padding:14px 32px; border-radius:8px; text-decoration:none; font-size:16px; font-weight:bold;">
                  Daftar Sekarang
                </a>
              </p>
              <p style="color:#9ca3af; font-size:13px; text-align:center;">
                Jika tombol tidak berfungsi, salin link berikut:<br>
                <a href="{{registrationLink}}" style="color:#6366f1;">{{registrationLink}}</a>
              </p>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="background:#f9fafb; padding:20px; text-align:center;">
              <p style="color:#9ca3af; font-size:12px; margin:0;">
                Meetsy Communication &copy; 2026
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
